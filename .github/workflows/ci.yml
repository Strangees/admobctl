name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be creating a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 20 is past end-of-life but still the bundle's target. vitest needs 22.12+, so on 20 CI only smoke-tests the
        # bundle; the typecheck also checks src/ against Node 20's types (tsconfig.node20.json).
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        if: matrix.node != 20
      - run: npm run build
      # git status, not git diff: a new file nobody committed must fail too.
      - name: Committed bundle is up to date
        run: |
          stale="$(git status --porcelain --untracked-files=all -- plugin/dist)"
          if [ -n "$stale" ]; then
            echo "::error::plugin/dist does not match the build. Run npm run build and commit plugin/dist."
            echo "$stale"
            exit 1
          fi
      - name: Bundle runs on this Node version
        run: node scripts/smoke-bundle.mjs
      - name: MCP server on this Node version lists the committed tools
        run: |
          node scripts/dump-tools.mjs "$RUNNER_TEMP/tools.json"
          diff -u plugin/evals/mocks/admobctl/_tools.json "$RUNNER_TEMP/tools.json"
      - run: npm test
        if: matrix.node != 20
      # `npm run eval` itself needs Claude credentials and is run by hand.
      - name: Committed eval mocks are up to date
        if: matrix.node == 22
        run: |
          npm run eval:mocks
          stale="$(git status --porcelain --untracked-files=all -- plugin/evals/mocks)"
          if [ -n "$stale" ]; then
            echo "::error::plugin/evals/mocks does not match the MCP tools. Run npm run eval:mocks and commit plugin/evals/mocks."
            echo "$stale"
            exit 1
          fi

  # Plugins install straight from main, and `claude plugin update` only sees a change when the version changes.
  # So a release is: bump the version, merge to main. This tags it and publishes a GitHub release.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release the version on main unless it is already tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version package.json)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to do."
            exit 0
          fi
          (cd plugin/dist && sha256sum admobctl.mjs) > admobctl.mjs.sha256
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes \
            plugin/dist/admobctl.mjs admobctl.mjs.sha256
      # Later: npm publish and the Homebrew formula hang off `on: release: types: [published]`
      # in their own workflow, once the repository is public.
