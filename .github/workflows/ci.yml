name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be creating a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 20 is past end-of-life but still the bundle's target; it only has to run the bundle.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
        if: matrix.node != 20
      - run: npm run build
      - name: Committed plugin/dist is up to date
        # Also fails on files the build added or removed, which `git diff` alone would miss.
        run: git add --all plugin/dist && git diff --cached --exit-code --stat plugin/dist
      - name: Bundle runs on this Node version
        run: node plugin/dist/admobctl.mjs --version
      - name: Standalone release file runs on this Node version
        run: node scripts/build.mjs --standalone dist/admobctl.mjs && node dist/admobctl.mjs --version
      - run: npm test
        if: matrix.node != 20
      # `npm run eval` itself needs Claude credentials and is run by hand.
      - name: Committed eval mocks are up to date
        if: matrix.node == 22
        run: npm run eval:mocks && git diff --exit-code plugin/evals/mocks

  # Plugins install straight from main, and `claude plugin update` only sees a change when the version changes.
  # So a release is: bump the version, merge to main. This tags it and publishes a GitHub release; the npm job below
  # publishes the npm package. Each skips what is already out, so rerunning a half-failed release finishes it.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Release the version on main unless it is already tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version package.json)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to do."
            exit 0
          fi
          # plugin/dist is one file per module; the release asset is the same program as a single file.
          node scripts/build.mjs --standalone dist/admobctl.mjs
          (cd dist && sha256sum admobctl.mjs) > admobctl.mjs.sha256
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes \
            dist/admobctl.mjs admobctl.mjs.sha256

  # npm is published here, not from an `on: release` workflow: a release created with GITHUB_TOKEN triggers no workflows.
  # This job alone can mint the npm OIDC token, so it installs and runs nothing but npm itself: no `npm ci` (dev
  # dependencies' install scripts), no cache. It publishes the committed plugin/dist, which the test job checked.
  # Trusted publisher on npmjs.com: user Strangees, repository admobctl, workflow ci.yml, no environment,
  # `npm publish` allowed (README, "CI and releases").
  npm:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC); no npm token is stored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the version on main to npm unless it is already there
        run: |
          version="$(jq -r .version package.json)"
          if npm view "admobctl@$version" version >/dev/null 2>&1; then
            echo "admobctl@$version is already on npm; nothing to do."
            exit 0
          fi
          # Trusted publishing needs npm 11.5.1 or later, which Node 24 bundles; never install npm in this job.
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a==11&&(b>5||(b==5&&c>=1)))?0:1)' "$(npm --version)"; then
            echo "::error::npm $(npm --version) is too old for trusted publishing (needs 11.5.1 or later)"
            exit 1
          fi
          npm publish --access public --ignore-scripts
